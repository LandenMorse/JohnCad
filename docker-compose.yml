# Two services, run on different machines:
#
#   db        Postgres for the JohnCad site.   Site Pi:    docker compose up -d db
#   bambuddy  Talks to the printers.           School Pi:  docker compose up -d bambuddy
#
# (scripts/setup-site.sh starts `db` for you. The site itself, gunicorn and the
# workers, runs on the host, not in Docker: it needs the OrcaSlicer Flatpak.)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-johncad}
      POSTGRES_USER: ${POSTGRES_USER:-johncad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-johncad}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-johncad}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bambuddy talks to the printers (FTPS 990 + MQTT 8883) and exposes the REST
  # API the print agent uses. Host networking (Bambuddy's own recommendation on
  # Linux) lets it reach the printers on the local network. It listens on
  # BAMBUDDY_PORT (default 8080).
  bambuddy:
    # Pin a release tag (BAMBUDDY_VERSION in .env) once one is chosen;
    # "latest" can change printer behavior under you.
    image: ghcr.io/maziggy/bambuddy:${BAMBUDDY_VERSION:-latest}
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${BAMBUDDY_PORT:-8080}
      TZ: America/Los_Angeles
    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs

volumes:
  postgres_data:
  bambuddy_data:
  bambuddy_logs:
