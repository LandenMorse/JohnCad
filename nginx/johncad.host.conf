# nginx site config for running nginx directly on the Raspberry Pi (host),
# in front of gunicorn on 127.0.0.1:8000. See README "Raspberry Pi deployment".
#
# Install:
#   sudo cp nginx/johncad.host.conf /etc/nginx/sites-available/johncad
#   sudo ln -s /etc/nginx/sites-available/johncad /etc/nginx/sites-enabled/johncad
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo certbot certonly --webroot -w /var/www/certbot -d rhsprint.crabdance.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before the cert exists, `nginx -t` fails on the ssl_certificate lines: get
# the cert first using the port-80 server block alone (comment out the 443
# block), then re-enable it.

# Keep in sync with DATA_UPLOAD_MAX_MEMORY_SIZE / upload limits in cms/settings.py.
client_max_body_size 512M;

server {
    listen 80;
    listen [::]:80;
    server_name rhsprint.crabdance.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rhsprint.crabdance.com;

    ssl_certificate     /etc/letsencrypt/live/rhsprint.crabdance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhsprint.crabdance.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Approving a job slices synchronously inside the request; keep this
        # >= gunicorn --timeout and ORCA_SLICER_TIMEOUT.
        proxy_read_timeout 900s;
    }
}
