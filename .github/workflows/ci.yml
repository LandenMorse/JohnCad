name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for CI only. Real deployments read these from .env.
  SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
  POSTGRES_DB: johncad
  POSTGRES_USER: johncad
  POSTGRES_PASSWORD: johncad
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Keep in step with the db image in docker-compose.yml.
        image: postgres:16
        env:
          POSTGRES_DB: johncad
          POSTGRES_USER: johncad
          POSTGRES_PASSWORD: johncad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U johncad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Model changes have migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply from scratch
        run: python manage.py migrate --noinput
      - name: Tests
        # Deprecation warnings are errors so the next Django upgrade is
        # never a surprise.
        run: python -W error::DeprecationWarning manage.py test

  deploy-check:
    name: Production settings check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: manage.py check --deploy
        env:
          DEBUG: "False"
          HTTPS_ENABLED: "True"
          ALLOWED_HOSTS: example.org
        run: python manage.py check --deploy --fail-level WARNING

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t johncad:ci .
