name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Shell scripts (shellcheck)
        run: shellcheck -x scripts/*.sh entrypoint.sh

  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Throwaway values for CI only. Real deployments read these from .env.
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      POSTGRES_PASSWORD: johncad
    services:
      postgres:
        # Keep in step with the db image in docker-compose.yml.
        image: postgres:16
        env:
          POSTGRES_DB: johncad
          POSTGRES_USER: johncad
          POSTGRES_PASSWORD: johncad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U johncad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Model changes have migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply from scratch
        run: python manage.py migrate --noinput
      - name: Tests
        # Deprecation warnings are errors so the next Django upgrade is
        # never a surprise.
        run: python -W error::DeprecationWarning manage.py test

  deploy-check:
    name: Production settings check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: manage.py check --deploy
        env:
          DEBUG: "False"
          HTTPS_ENABLED: "True"
          SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: example.org
        run: python manage.py check --deploy --fail-level WARNING

  audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t johncad:ci .

  install-drill:
    # Runs the real installer on a clean machine, then proves a backup can be
    # restored: the same scripts a teacher runs on the Pi.
    name: Install, backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install with scripts/setup-pi.sh
        run: scripts/setup-pi.sh --no-orca
      - name: Site answers
        run: curl -fsS http://127.0.0.1:8000/healthz/
      - name: Installer is safe to run twice
        run: scripts/setup-pi.sh --no-orca
      - name: Backup, lose data, restore
        run: scripts/restore-drill.sh
      - name: Service logs (on failure)
        if: failure()
        run: |
          sudo journalctl -u johncad -u johncad-slicer -u johncad-dispatcher -n 80 --no-pager || true
          docker compose logs db | tail -n 40 || true
